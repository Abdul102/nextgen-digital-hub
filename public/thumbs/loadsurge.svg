<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320">
  <rect width="560" height="320" fill="#0f172a" rx="12"/>
  <rect width="560" height="40" fill="#1e293b" rx="12"/>
  <rect y="28" width="560" height="12" fill="#1e293b"/>
  <circle cx="20" cy="20" r="6" fill="#ef4444" opacity=".8"/>
  <circle cx="38" cy="20" r="6" fill="#f59e0b" opacity=".8"/>
  <circle cx="56" cy="20" r="6" fill="#22c55e" opacity=".8"/>
  <text x="280" y="25" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">LoadSurge — Performance Testing Pipeline</text>
  <!-- stat cards -->
  <rect x="12" y="52" width="126" height="50" rx="8" fill="#1e293b"/>
  <text x="75" y="72" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="13" font-weight="bold">p95&lt;200ms</text>
  <text x="75" y="88" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="8">Latency Gate</text>
  <rect x="146" y="52" width="126" height="50" rx="8" fill="#1e293b"/>
  <text x="209" y="72" text-anchor="middle" fill="#06b6d4" font-family="monospace" font-size="18" font-weight="bold">5,000</text>
  <text x="209" y="88" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="8">Virtual Users</text>
  <rect x="280" y="52" width="126" height="50" rx="8" fill="#1e293b"/>
  <text x="343" y="72" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="18" font-weight="bold">2,840</text>
  <text x="343" y="88" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="8">Req/sec</text>
  <rect x="414" y="52" width="134" height="50" rx="8" fill="#1e293b"/>
  <text x="481" y="72" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="18" font-weight="bold">0.02%</text>
  <text x="481" y="88" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="8">Error Rate</text>
  <!-- chart area -->
  <rect x="12" y="114" width="380" height="130" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="22" y="130" fill="#94a3b8" font-family="monospace" font-size="8" font-weight="bold">LATENCY CHART (p50 / p95 / p99)</text>
  <!-- grid lines -->
  <line x1="22" y1="148" x2="382" y2="148" stroke="#334155" stroke-width="1"/>
  <line x1="22" y1="168" x2="382" y2="168" stroke="#334155" stroke-width="1"/>
  <line x1="22" y1="188" x2="382" y2="188" stroke="#334155" stroke-width="1"/>
  <text x="16" y="151" fill="#64748b" font-family="monospace" font-size="7" text-anchor="end">300ms</text>
  <text x="16" y="171" fill="#64748b" font-family="monospace" font-size="7" text-anchor="end">200ms</text>
  <text x="16" y="191" fill="#64748b" font-family="monospace" font-size="7" text-anchor="end">100ms</text>
  <!-- threshold -->
  <line x1="22" y1="168" x2="382" y2="168" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,4" opacity=".7"/>
  <text x="368" y="165" fill="#ef4444" font-family="monospace" font-size="7">threshold</text>
  <!-- p95 line -->
  <polyline points="22,188 80,184 130,180 180,178 230,175 280,182 320,170 355,168 382,165" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <!-- p50 line -->
  <polyline points="22,210 80,208 130,205 180,202 230,200 280,203 320,198 355,195 382,193" fill="none" stroke="#22c55e" stroke-width="2"/>
  <!-- p99 line dashed -->
  <polyline points="22,175 80,170 130,162 180,158 230,154 280,162 320,148 355,145 382,142" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- legend -->
  <circle cx="32" cy="228" r="4" fill="#22c55e"/><text x="40" y="232" fill="#22c55e" font-family="monospace" font-size="7">p50: 58ms</text>
  <circle cx="110" cy="228" r="4" fill="#f59e0b"/><text x="118" y="232" fill="#f59e0b" font-family="monospace" font-size="7">p95: 142ms</text>
  <circle cx="188" cy="228" r="4" fill="#06b6d4"/><text x="196" y="232" fill="#06b6d4" font-family="monospace" font-size="7">p99: 198ms</text>
  <!-- CI gates -->
  <rect x="402" y="114" width="146" height="130" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="412" y="130" fill="#94a3b8" font-family="monospace" font-size="8" font-weight="bold">CI/CD GATES</text>
  <rect x="410" y="136" width="130" height="28" rx="6" fill="rgba(34,197,94,.1)" stroke="#22c55e" stroke-width="1"/>
  <text x="412" y="149" fill="#64748b" font-family="monospace" font-size="7">p95 Latency</text>
  <text x="412" y="161" fill="#22c55e" font-family="monospace" font-size="9" font-weight="bold">142ms ✓</text>
  <rect x="410" y="170" width="130" height="28" rx="6" fill="rgba(34,197,94,.1)" stroke="#22c55e" stroke-width="1"/>
  <text x="412" y="183" fill="#64748b" font-family="monospace" font-size="7">Error Rate</text>
  <text x="412" y="195" fill="#22c55e" font-family="monospace" font-size="9" font-weight="bold">0.02% ✓</text>
  <rect x="410" y="204" width="130" height="28" rx="6" fill="rgba(34,197,94,.1)" stroke="#22c55e" stroke-width="1"/>
  <text x="412" y="217" fill="#64748b" font-family="monospace" font-size="7">Throughput</text>
  <text x="412" y="229" fill="#22c55e" font-family="monospace" font-size="9" font-weight="bold">2,840 rps ✓</text>
  <!-- footer -->
  <rect x="12" y="256" width="536" height="28" rx="8" fill="rgba(34,197,94,.08)" stroke="#22c55e" stroke-width="1"/>
  <text x="280" y="273" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="9" font-weight="bold">✓  All thresholds passed — PR is clear to merge  ·  10,000 VU peak tested</text>
</svg>
