  <rect x="474" y="240" width="30" height="11" rx="5" fill="rgba(34,197,94,.2)"/><text x="489" y="249" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="7">PASS</text>
  <text x="292" y="262" fill="#e2e8f0" font-family="monospace" font-size="7">SLA guarantees?</text>
  <text x="430" y="262" fill="#f59e0b" font-family="monospace" font-size="7">72%</text>
  <rect x="468" y="254" width="42" height="11" rx="5" fill="rgba(245,158,11,.2)"/><text x="489" y="263" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="7">REVIEW</text>
