  <text x="350" y="152" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="7">Prompt A (Current)</text>
  <text x="296" y="165" fill="#94a3b8" font-family="monospace" font-size="7">"Answer strictly</text>
  <text x="296" y="177" fill="#94a3b8" font-family="monospace" font-size="7">from context..."</text>
  <text x="350" y="193" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="10" font-weight="bold">96.2%</text>
  <rect x="420" y="138" width="116" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="478" y="152" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="7">Prompt B (Candidate)</text>
  <text x="424" y="165" fill="#94a3b8" font-family="monospace" font-size="7">"Use docs only,</text>
  <text x="424" y="177" fill="#94a3b8" font-family="monospace" font-size="7">cite sources..."</text>
  <text x="478" y="193" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="10" font-weight="bold">91.4%</text>
  <text x="415" y="216" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="8">✓ Prompt A wins — shipping</text>
  <!-- test table -->
  <text x="292" y="232" fill="#64748b" font-family="monospace" font-size="7">QUESTION</text>
  <text x="430" y="232" fill="#64748b" font-family="monospace" font-size="7">FAITH.</text>
  <text x="476" y="232" fill="#64748b" font-family="monospace" font-size="7">VERDICT</text>
